<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche titre — TAPA CONSEIL</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css">
<style>
.loupe { border:1px solid #E3D6A8; border-radius:10px; margin:18px 0; overflow:hidden; background:#FFFDF6; }
.loupe-bandeau { background:#0A1B3D; color:#fff; padding:12px 18px; display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; border-bottom:3px solid #C9A227; }
.loupe-marque { font-weight:700; letter-spacing:1.5px; font-size:15px; }
.loupe-rubrique { color:#C9A227; font-weight:700; letter-spacing:1px; font-size:18px; }
.loupe-num { margin-left:auto; font-size:14px; opacity:.8; letter-spacing:1px; }
.loupe-corps { padding:6px 22px 20px; max-width:780px; font-size:18px; line-height:1.75; }
.loupe-titre { color:#0A1B3D; margin:16px 0 6px; font-size:26px; }
.loupe-corps h4 { color:#0A1B3D; font-size:21px; border-bottom:2px solid #C9A227; padding-bottom:4px; margin-top:26px; }
.loupe-table { border-collapse:collapse; width:100%; margin:10px 0; font-size:16px; }
.loupe-table th { background:#0A1B3D; color:#fff; text-align:left; padding:10px 12px; font-size:14px; letter-spacing:.5px; }
.loupe-table td { padding:10px 12px; border-bottom:1px solid #E1E5EC; }
.loupe-table td.v { font-weight:700; color:#0A1B3D; white-space:nowrap; }
.loupe-table tr:nth-child(even) td { background:#F8F4E6; }
</style>
</head>
<body>
  <div class="topbar"><div class="brand"><img src="/images/logo.png" alt="TAPA CONSEIL"></div><a href="/titres.html">← Toutes les sociétés</a></div>
  <div class="container" style="max-width: 760px;">
    <div class="card" id="fiche-content"><p>Chargement...</p></div>
    <div class="card" id="graphique-content" style="display:none;">
      <h2>Évolution du cours</h2>
      <div id="graphique-cours"></div>
    </div>
    <div class="card" id="finance-content"></div>
    <div class="card" id="dividendes-content"></div>
    <div class="card" id="etudes-content"></div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    // Petit graphique SVG en barres colorées, réutilisable pour n'importe quelle série
    // (dividendes, chiffre d'affaires, bénéfice net...) — année en abscisse, montant en ordonnée.
    function graphiqueBarres(donnees, cleAnnee, cleValeur, couleur, unite) {
      const points = donnees.filter(d => d[cleValeur] !== null && d[cleValeur] !== undefined);
      if (points.length < 1) return '<p style="color:#999; font-size:13px;">Pas encore assez de données pour un graphique.</p>';
      const largeur = 600, hauteur = 220, margeGauche = 70, margeBas = 30, margeHaut = 10;
      const valeurs = points.map(p => Number(p[cleValeur]));
      const maxValeur = Math.max(...valeurs, 0);
      const largeurZone = largeur - margeGauche - 10;
      const largeurBarre = Math.min(60, largeurZone / points.length - 12);

      let svg = `<svg viewBox="0 0 ${largeur} ${hauteur}" style="width:100%; height:auto; max-width:500px;">`;
      // Ligne de repère à zéro
      svg += `<line x1="${margeGauche}" y1="${hauteur - margeBas}" x2="${largeur - 10}" y2="${hauteur - margeBas}" stroke="#ccc" />`;
      // Étiquette de la valeur maximale, pour donner une échelle
      svg += `<text x="${margeGauche - 8}" y="${margeHaut + 10}" font-size="10" fill="#999" text-anchor="end">${Math.round(maxValeur).toLocaleString('fr-FR')}</text>`;

      points.forEach((p, i) => {
        const valeur = Number(p[cleValeur]);
        const hauteurBarre = maxValeur > 0 ? (valeur / maxValeur) * (hauteur - margeBas - margeHaut) : 0;
        const x = margeGauche + i * (largeurZone / points.length) + 6;
        const y = hauteur - margeBas - hauteurBarre;
        if (valeur === 0) {
          // Une valeur à 0 mérite un vrai repère visuel — pas une barre invisible qui pourrait
          // passer pour une donnée manquante alors que c'est une vraie information (ex: aucun
          // dividende versé cette année-là).
          svg += `<circle cx="${x + largeurBarre / 2}" cy="${hauteur - margeBas}" r="5" fill="#C0392B" />`;
          svg += `<text x="${x + largeurBarre / 2}" y="${hauteur - margeBas - 10}" font-size="10" fill="#C0392B" text-anchor="middle" font-weight="600">0</text>`;
        } else {
          svg += `<rect x="${x}" y="${y}" width="${largeurBarre}" height="${hauteurBarre}" fill="${couleur}" rx="3" />`;
          svg += `<text x="${x + largeurBarre / 2}" y="${y - 6}" font-size="10" fill="${couleur}" text-anchor="middle" font-weight="600">${Math.round(valeur).toLocaleString('fr-FR')}</text>`;
        }
        svg += `<text x="${x + largeurBarre / 2}" y="${hauteur - margeBas + 14}" font-size="11" fill="#555" text-anchor="middle">${p[cleAnnee]}</text>`;
      });
      svg += `</svg>`;
      return svg;
    }


    // Graphique de l'évolution du cours : axe des prix gradué en FCFA, dates en bas, plus bas / plus haut
    // repérés, et survol (souris ou doigt) qui affiche la date, le prix et la variation du jour.
    function dessinerGraphiqueCours(historique) {
      const points = [...historique].reverse().map(p => ({ date: new Date(p.date_cours), cours: Number(p.cours) }));
      const n = points.length;
      const L = 720, H = 330, mg = 92, md = 24, mh = 30, mb = 40;
      const fmt = v => Math.round(v).toLocaleString('fr-FR');
      const fmtDate = (d, long) => d.toLocaleDateString('fr-FR', long ? { day: '2-digit', month: '2-digit', year: 'numeric' } : { day: '2-digit', month: '2-digit' });
      const valeurs = points.map(p => p.cours);
      const minVal = Math.min(...valeurs), maxVal = Math.max(...valeurs);

      // Graduations « rondes » : pas de 1, 2 ou 5 fois une puissance de 10 (ex. 3 000, 3 500, 4 000 FCFA).
      const etendue = (maxVal - minVal) || Math.max(1, maxVal * 0.1);
      const pas0 = etendue / 5;
      const puiss = Math.pow(10, Math.floor(Math.log10(pas0)));
      const frac = pas0 / puiss;
      const pasPrix = Math.max(1, (frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10) * puiss);
      const bas = Math.floor(minVal / pasPrix) * pasPrix;
      let haut = Math.ceil(maxVal / pasPrix) * pasPrix;
      if (haut <= bas) haut = bas + pasPrix;
      const graduations = [];
      for (let v = bas; v <= haut + 1e-9; v += pasPrix) graduations.push(v);

      const pas = (L - mg - md) / (n - 1);
      const X = i => mg + i * pas;
      const Y = v => H - mb - ((v - bas) / (haut - bas)) * (H - mb - mh);
      const iMin = valeurs.indexOf(minVal), iMax = valeurs.indexOf(maxVal);
      const ligne = points.map((p, i) => `${X(i)},${Y(p.cours)}`).join(' ');
      const aire = `M ${X(0)},${H - mb} L ${ligne.replace(/ /g, ' L ')} L ${X(n - 1)},${H - mb} Z`;

      // Environ 6 dates réparties sur l'axe, première et dernière comprises.
      const nbDates = Math.min(n, 6);
      const indicesDates = [...new Set(Array.from({ length: nbDates }, (_, k) => Math.round(k * (n - 1) / (nbDates - 1))))];

      const etiquette = (i, texte, couleur) => {
        const x = X(i), ancre = x < mg + 70 ? 'start' : (x > L - md - 70 ? 'end' : 'middle');
        return `<text x="${x}" y="${Y(points[i].cours) - 11}" font-size="11.5" font-weight="700" fill="${couleur}" text-anchor="${ancre}">${texte}</text>`;
      };

      const svg = `
        <svg id="svg-cours" viewBox="0 0 ${L} ${H}" style="width:100%; height:auto; touch-action:pan-y; cursor:crosshair;">
          <defs><linearGradient id="degrade-cours" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F2F59" stop-opacity="0.18"/><stop offset="100%" stop-color="#0F2F59" stop-opacity="0.02"/></linearGradient></defs>
          <text x="${mg - 10}" y="${mh - 14}" font-size="11" fill="#777" text-anchor="end" font-weight="600">Prix (FCFA)</text>
          ${graduations.map(v => `<line x1="${mg}" y1="${Y(v)}" x2="${L - md}" y2="${Y(v)}" stroke="${v === bas ? '#B8C0CC' : '#E8ECF2'}" /><text x="${mg - 10}" y="${Y(v) + 4}" font-size="12" fill="#555" text-anchor="end">${fmt(v)}</text>`).join('')}
          ${indicesDates.map(i => `<line x1="${X(i)}" y1="${H - mb}" x2="${X(i)}" y2="${H - mb + 5}" stroke="#B8C0CC" /><text x="${X(i)}" y="${H - mb + 20}" font-size="12" fill="#555" text-anchor="${i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')}">${fmtDate(points[i].date)}</text>`).join('')}
          <path d="${aire}" fill="url(#degrade-cours)" />
          <polyline points="${ligne}" fill="none" stroke="#0F2F59" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />
          <circle cx="${X(iMax)}" cy="${Y(maxVal)}" r="5" fill="#0B6E4F" stroke="#fff" stroke-width="2" />${etiquette(iMax, fmt(maxVal), '#0B6E4F')}
          ${iMin !== iMax ? `<circle cx="${X(iMin)}" cy="${Y(minVal)}" r="5" fill="#C0392B" stroke="#fff" stroke-width="2" />${etiquette(iMin, fmt(minVal), '#C0392B')}` : ''}
          <circle cx="${X(n - 1)}" cy="${Y(valeurs[n - 1])}" r="5.5" fill="#C9A227" stroke="#fff" stroke-width="2" />
          <g id="survol-cours" style="display:none; pointer-events:none;">
            <line id="survol-ligne" y1="${mh - 6}" y2="${H - mb}" stroke="#C9A227" stroke-width="1.5" stroke-dasharray="4 3" />
            <circle id="survol-point" r="6" fill="#C9A227" stroke="#fff" stroke-width="2" />
            <g id="survol-boite"><rect width="150" height="50" rx="8" fill="#0F2F59" /><text id="survol-prix" x="12" y="21" font-size="14" font-weight="700" fill="#fff"></text><text id="survol-date" x="12" y="39" font-size="11.5" fill="#DDE3EE"></text></g>
          </g>
        </svg>`;
      document.getElementById('graphique-content').style.display = 'block';
      const conteneur = document.getElementById('graphique-cours');
      conteneur.innerHTML = svg + `<p style="font-size:12px; color:#777; margin-top:6px;">Du ${fmtDate(points[0].date, true)} au ${fmtDate(points[n - 1].date, true)} — Plus bas : <strong>${fmt(minVal)} FCFA</strong> — Plus haut : <strong>${fmt(maxVal)} FCFA</strong>. Passez la souris (ou le doigt) sur la courbe pour lire chaque prix.</p>`;

      const el = conteneur.querySelector('#svg-cours');
      const groupe = conteneur.querySelector('#survol-cours');
      const montrer = clientX => {
        const r = el.getBoundingClientRect();
        const xSvg = (clientX - r.left) * L / r.width;
        const i = Math.max(0, Math.min(n - 1, Math.round((xSvg - mg) / pas)));
        const p = points[i], x = X(i), y = Y(p.cours);
        const prec = i > 0 ? points[i - 1].cours : null;
        const variation = prec ? ((p.cours - prec) / prec) * 100 : null;
        groupe.style.display = 'block';
        conteneur.querySelector('#survol-ligne').setAttribute('x1', x);
        conteneur.querySelector('#survol-ligne').setAttribute('x2', x);
        conteneur.querySelector('#survol-point').setAttribute('cx', x);
        conteneur.querySelector('#survol-point').setAttribute('cy', y);
        conteneur.querySelector('#survol-prix').textContent = `${fmt(p.cours)} FCFA` + (variation !== null ? `  ${variation >= 0 ? '+' : ''}${variation.toFixed(2).replace('.', ',')} %` : '');
        conteneur.querySelector('#survol-date').textContent = fmtDate(p.date, true);
        const bx = x > L / 2 ? x - 162 : x + 12;
        conteneur.querySelector('#survol-boite').setAttribute('transform', `translate(${bx},${Math.max(mh, Math.min(y - 25, H - mb - 55))})`);
      };
      el.addEventListener('pointermove', e => montrer(e.clientX));
      el.addEventListener('pointerdown', e => montrer(e.clientX));
      el.addEventListener('pointerleave', () => { groupe.style.display = 'none'; });
    }

    const params = new URLSearchParams(window.location.search);
    const ticker = params.get('ticker');
    (async () => {
      const user = await requireLogin(); if (!user) return;
      if (!ticker) { document.getElementById('fiche-content').innerHTML = '<p class="error">Aucun titre spécifié.</p>'; return; }
      try {
        const { titre, historique, dividendes, donnees_financieres, etudes, etudes_reservees, nombre_etudes, performance_pct } = await apiCall(`/api/titres/${ticker}`);
        const dernierCours = historique[0];
        document.getElementById('fiche-content').innerHTML = `
          <h1>${titre.nom}</h1>
          <p><span class="badge badge-equilibre">${titre.ticker}</span> ${titre.secteur ? `— ${titre.secteur}` : ''} ${titre.pays ? `— ${titre.pays}` : ''}</p>
          ${!titre.fiche_complete ? `<div class="alert">Cette fiche est en cours de vérification par notre équipe — certaines informations seront complétées prochainement.</div>` : ''}
          ${dernierCours ? `<p style="font-size:22px; margin-top:16px;"><strong>${Number(dernierCours.cours).toLocaleString('fr-FR')} FCFA</strong> <span style="color:${dernierCours.variation_pct > 0 ? '#0B6E4F' : (dernierCours.variation_pct < 0 ? '#C0392B' : '#777')}">${dernierCours.variation_pct > 0 ? '+' : ''}${dernierCours.variation_pct}%</span></p><p style="font-size:13px; color:#777;">Cours au ${new Date(dernierCours.date_cours).toLocaleDateString('fr-FR')}</p>` : '<p style="color:#999;">Aucun cours renseigné pour le moment.</p>'}
          ${performance_pct !== null ? `<p>Performance sur la période suivie : <strong style="color:${performance_pct >= 0 ? '#0B6E4F' : '#C0392B'}">${performance_pct > 0 ? '+' : ''}${performance_pct}%</strong></p>` : ''}
          ${titre.date_introduction ? `<p>Date d'introduction en bourse : <strong>${new Date(titre.date_introduction).toLocaleDateString('fr-FR')}</strong></p>` : ''}
          ${titre.description ? `<p>${titre.description}</p>` : ''}
        `;
        const elDiv = document.getElementById('dividendes-content');
        const dividendesRecentDabord = [...dividendes].reverse();
        elDiv.innerHTML = dividendes.length ? `<h2>Dividendes distribués</h2>${graphiqueBarres(dividendes, 'annee', 'montant_par_action', '#DAAA37', 'FCFA/action')}<table><thead><tr><th>Année</th><th>Montant par action</th></tr></thead><tbody>${dividendesRecentDabord.map(d => `<tr><td>${d.annee}</td><td>${Number(d.montant_par_action) === 0 ? '<span style="color:#C0392B;">Aucun dividende versé cette année</span>' : Number(d.montant_par_action).toLocaleString('fr-FR') + ' FCFA'}</td></tr>`).join('')}</tbody></table>` : `<h2>Dividendes distribués</h2><p style="color:#999;">Historique des dividendes non encore renseigné pour ce titre.</p>`;

        // Graphique du chiffre d'affaires et du bénéfice net — uniquement à partir des données
        // financières validées par TAPA CONSEIL (jamais une saisie en attente).
        const elFinance = document.getElementById('finance-content');
        if (elFinance) {
          elFinance.innerHTML = donnees_financieres.length
            ? `<h2>Évolution financière</h2>
               <h3 style="font-size:14px; margin-top:12px;">Chiffre d'affaires</h3>
               ${graphiqueBarres(donnees_financieres, 'annee', 'chiffre_affaires', '#0F2F59', 'FCFA')}
               <h3 style="font-size:14px; margin-top:16px;">Bénéfice net</h3>
               ${graphiqueBarres(donnees_financieres, 'annee', 'benefice_net', '#0B6E4F', 'FCFA')}`
            : `<h2>Évolution financière</h2><p style="color:#999;">Données financières non encore renseignées pour ce titre.</p>`;
        }
    // Convertit le Markdown simple utilisé par les études (titres #, gras **, italique *,
    // séparateurs ---, listes numérotées) en vraie mise en forme HTML.
    function markdownVersHtml(texte) {
      const lignes = texte.split('\n');
      let html = '';
      let typeListe = null; // null, 'ol' (numérotée) ou 'ul' (à puces)
      let tableau = [];
      let liOuverte = false;
      function fermerListe() {
        if (liOuverte) { html += '</li>'; liOuverte = false; }
        if (typeListe) { html += typeListe === 'ol' ? '</ol>' : '</ul>'; typeListe = null; }
      }
      function ouvrirListe(type, contenu) {
        if (liOuverte) html += '</li>';
        if (typeListe && typeListe !== type) { html += typeListe === 'ol' ? '</ol>' : '</ul>'; typeListe = null; }
        if (!typeListe) { html += type === 'ol' ? '<ol style="padding-left:20px;">' : '<ul style="padding-left:20px;">'; typeListe = type; }
        html += `<li>${contenu ? formaterInline(contenu) : ''}`;
        liOuverte = true;
      }
      for (let ligne of lignes) {
        ligne = ligne.trim();
        if (!ligne) continue; // les lignes vides ne ferment jamais une liste en cours — juste ignorées
        if (ligne.startsWith('|')) { // tableau : on accumule les lignes, rendu à la première ligne non-tableau
          tableau.push(ligne); continue;
        }
        if (tableau.length) { fermerListe(); html += rendreTableau(tableau); tableau = []; }
        if (ligne === '---') { fermerListe(); html += '<hr style="border:none; border-top:1px solid var(--border); margin:18px 0;">'; continue; }
        const mTitre = ligne.match(/^(#{1,4})\s+(.*)/);
        if (mTitre) {
          fermerListe();
          const niveau = Math.min(mTitre[1].length + 2, 4); // # -> h3, ## et ### -> h4 (jamais plus gros que le titre de la carte)
          html += `<h${niveau} style="margin-top:16px;">${formaterInline(mTitre[2])}</h${niveau}>`;
          continue;
        }
        const mListeNum = ligne.match(/^\d+\.\s*(.*)/);
        if (mListeNum) { ouvrirListe('ol', mListeNum[1]); continue; }
        const mListePuce = ligne.match(/^[-*]\s+(.*)/);
        if (mListePuce) { ouvrirListe('ul', mListePuce[1]); continue; }
        if (liOuverte && /^\*\*[^*]+\*\*/.test(ligne)) fermerListe(); // un intertitre en gras ferme la liste en cours
        if (liOuverte) { html += ' ' + formaterInline(ligne); continue; } // suite du texte du point de liste en cours
        html += `<p>${formaterInline(ligne)}</p>`;
      }
      if (tableau.length) { fermerListe(); html += rendreTableau(tableau); }
      fermerListe();
      return html;
    }
    function rendreTableau(lignes) {
      const cellules = l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const corps = lignes.filter(l => !/^\|\s*:?-{2,}/.test(l));
      if (!corps.length) return '';
      const [entete, ...rows] = corps;
      return `<div style="overflow-x:auto;"><table class="loupe-table"><thead><tr>${cellules(entete).map(c => `<th>${formaterInline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${cellules(r).map((c, i) => `<td${i === 1 ? ' class="v"' : ''}>${formaterInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    }
    // Fiche "L'action à la loupe" : marquée par {{LOUPE N°001}} en première ligne — habillage marine et or.
    function rendreEtude(e) {
      const m = e.contenu.trim().match(/^\{\{LOUPE ([^}]*)\}\}\s*/);
      const date = new Date(e.date_publication).toLocaleDateString('fr-FR');
      if (!m) return `<div class="question"><p><strong>${e.titre}</strong> <span style="font-size:12px; color:#777;">— ${date}</span></p>${markdownVersHtml(e.contenu)}</div>`;
      const corps = e.contenu.trim().slice(m[0].length);
      return `<div class="loupe"><div class="loupe-bandeau"><span class="loupe-marque">TAPA INVEST</span><span class="loupe-rubrique">L'ACTION À LA LOUPE</span><span class="loupe-num">ÉTUDE ${m[1].replace('N°', 'N° ')}</span></div><div class="loupe-corps"><h3 class="loupe-titre">${e.titre}</h3>${markdownVersHtml(corps)}</div></div>`;
    }
    function formaterInline(texte) {
      return texte
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    const elEtudes = document.getElementById('etudes-content');
        if (etudes_reservees) {
          elEtudes.innerHTML = `<h2>Études publiées par TAPA CONSEIL</h2>
            <div style="background:#FDF6E8; border:2px solid #C9A227; border-radius:10px; padding:18px; text-align:center;">
              <p style="font-size:28px; margin:0;">🔒</p>
              <p style="font-weight:700; margin:6px 0;">Les études « L'action à la loupe » sont réservées aux clients BRVM Starter.</p>
              ${nombre_etudes ? `<p style="margin:6px 0; color:#555;">${nombre_etudes} étude${nombre_etudes > 1 ? 's' : ''} disponible${nombre_etudes > 1 ? 's' : ''} pour ce titre.</p>` : ''}
              <a href="/#tarifs" style="display:inline-block; margin-top:8px; background:#0F2F59; color:white; padding:10px 22px; border-radius:6px; text-decoration:none; font-weight:600;">Découvrir l'accompagnement</a>
            </div>`;
        } else
        elEtudes.innerHTML = etudes.length ? `<h2>Études publiées par TAPA CONSEIL</h2>${etudes.map(rendreEtude).join('')}` : `<h2>Études publiées par TAPA CONSEIL</h2><p style="color:#999;">Aucune étude publiée pour ce titre pour le moment.</p>`;

        // Graphique du cours : prix (FCFA) à gauche, dates en bas, survol pour lire la date et le prix.
        if (historique.length >= 2) dessinerGraphiqueCours(historique);
      } catch (e) { document.getElementById('fiche-content').innerHTML = `<p class="error">${e.message}</p>`; }
    })();
  </script>
</body>
</html>
