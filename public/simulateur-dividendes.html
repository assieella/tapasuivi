<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur de dividendes — TAPA CONSEIL</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css">
<style>
  .resultat-box { background:#F5F7FA; border-radius:10px; padding:20px; margin-top:16px; }
  .resultat-box .gros-chiffre { font-size:28px; font-weight:700; color:var(--gold); font-family: Georgia, serif; }
  .table-annees { width:100%; border-collapse:collapse; font-size:14px; margin-top:12px; }
  .table-annees th { text-align:left; padding:8px; background:var(--navy); color:white; }
  .table-annees td { padding:8px; border-bottom:1px solid var(--border); }
</style>
</head>
<body>
  <div class="topbar"><div class="brand"><img src="/images/logo.png" alt="TAPA CONSEIL"></div><a href="/dashboard.html">← Mon espace</a></div>
  <div class="container">
    <div class="card">
      <h1>💰 Simulateur de dividendes</h1>
      <p style="font-size:14px; color:#666;">Estimez le revenu de dividendes que vous auriez pu percevoir, à partir de l'historique réel d'un titre.</p>

      <label>Titre</label>
      <input type="text" id="recherche-titre" list="liste-titres" placeholder="Tape un nom ou un code (ex: SNTS, Sonatel...)" autocomplete="off">
      <datalist id="liste-titres"></datalist>

      <label>Montant que vous voulez investir (FCFA)</label>
      <input type="number" id="montant-investi" placeholder="Ex: 500000" min="1">

      <button onclick="simuler()">Simuler</button>
      <div id="resultat-simulation"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    let titresParLabel = {};
    let coursParTicker = {};

    async function chargerListeTitres() {
      const { titres } = await apiCall('/api/titres');
      const elListe = document.getElementById('liste-titres');
      elListe.innerHTML = titres.filter(t => t.cours).map(t => {
        const label = `${t.ticker} — ${t.nom}`;
        titresParLabel[label] = t.ticker;
        return `<option value="${label}">`;
      }).join('');
    }

    async function simuler() {
      const el = document.getElementById('resultat-simulation');
      const ticker = titresParLabel[document.getElementById('recherche-titre').value];
      const montant = Number(document.getElementById('montant-investi').value);

      if (!ticker) { el.innerHTML = '<p class="error">Choisis un titre valide dans la liste.</p>'; return; }
      if (!montant || montant <= 0) { el.innerHTML = '<p class="error">Indique un montant à investir.</p>'; return; }

      el.innerHTML = '<p style="color:#999;">Calcul en cours...</p>';
      try {
        const { titre, historique, dividendes } = await apiCall(`/api/titres/${ticker}`);
        if (!historique.length) { el.innerHTML = '<p class="error">Aucun cours connu pour ce titre — impossible de simuler.</p>'; return; }

        const coursActuel = Number(historique[0].cours);
        const nombreActions = Math.floor(montant / coursActuel);
        const montantReellementInvesti = nombreActions * coursActuel;

        const dividendesReels = dividendes.filter(d => Number(d.montant_par_action) > 0);
        if (!dividendesReels.length) {
          el.innerHTML = `
            <div class="resultat-box">
              <p>Avec ${montant.toLocaleString('fr-FR')} FCFA, vous pourriez acheter <strong>${nombreActions} action${nombreActions > 1 ? 's' : ''}</strong> ${titre.nom} au cours actuel (${coursActuel.toLocaleString('fr-FR')} FCFA).</p>
              <p style="color:#999; margin-top:8px;">Aucun dividende connu pour ce titre pour le moment — impossible d'estimer un revenu.</p>
            </div>
          `;
          return;
        }

        const dernierDividende = dividendesReels[dividendesReels.length - 1];
        const revenuEstime = nombreActions * Number(dernierDividende.montant_par_action);

        el.innerHTML = `
          <div class="resultat-box">
            <p>Avec <strong>${montant.toLocaleString('fr-FR')} FCFA</strong>, vous pourriez acheter <strong>${nombreActions} action${nombreActions > 1 ? 's' : ''}</strong> ${titre.nom} au cours actuel (${coursActuel.toLocaleString('fr-FR')} FCFA/action) — soit ${montantReellementInvesti.toLocaleString('fr-FR')} FCFA réellement investis.</p>
            <p style="margin-top:12px;">Sur la base du dividende réellement versé en <strong>${dernierDividende.annee}</strong> (${Number(dernierDividende.montant_par_action).toLocaleString('fr-FR')} FCFA/action), vous auriez perçu :</p>
            <p class="gros-chiffre">${revenuEstime.toLocaleString('fr-FR')} FCFA</p>
            <table class="table-annees">
              <thead><tr><th>Année</th><th>Dividende/action</th><th>Sur ${nombreActions} actions</th></tr></thead>
              <tbody>
                ${[...dividendesReels].reverse().map(d => `
                  <tr><td>${d.annee}</td><td>${Number(d.montant_par_action).toLocaleString('fr-FR')} FCFA</td><td>${(nombreActions * Number(d.montant_par_action)).toLocaleString('fr-FR')} FCFA</td></tr>
                `).join('')}
              </tbody>
            </table>
            <p style="font-size:12px; color:#777; margin-top:14px;">⚠️ Ceci est une estimation basée sur des dividendes déjà versés par le passé — rien ne garantit qu'une société continue à verser le même dividende à l'avenir. Ce n'est pas une recommandation d'achat.</p>
          </div>
        `;
      } catch (e) { el.innerHTML = `<p class="error">${e.message}</p>`; }
    }

    (async () => {
      const user = await requireLogin(); if (!user) return;
      try { await chargerListeTitres(); }
      catch (e) {
        if (e.acces_termine) { afficherAccesTermine(document.querySelector('.container')); return; }
      }
    })();
  </script>
</body>
</html>
