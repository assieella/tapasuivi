<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte gratuit — TAPA CONSEIL</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar"><div class="brand"><img src="/images/logo.png" alt="TAPA CONSEIL"></div><a href="/">Accueil</a></div>
  <div class="container" style="max-width: 500px;">
    <div class="card">
      <h1>Créer votre compte gratuit</h1>
      <p style="font-size:14px; color:#666;">Accédez gratuitement au TEST TAPA, au portefeuille virtuel, aux calculateurs, à l'annuaire SGI/SGO et aux actualités du marché BRVM. La formation et l'accompagnement personnalisé restent réservés à BRVM Starter.</p>
      <form id="form-inscription">
        <label>Prénom</label><input type="text" id="prenom" required>
        <label>Nom</label><input type="text" id="nom" required>
        <label>Email</label><input type="email" id="email" required>
        <label>Téléphone (optionnel)</label><input type="tel" id="phone">
        <label>Mot de passe</label><input type="password" id="password" required minlength="6">
        <button type="submit">Créer mon compte gratuit</button>
        <div id="erreur-inscription"></div>
      </form>
      <p style="font-size:13px; margin-top:14px;">Déjà client BRVM Starter ? <a href="/connexion.html">Connectez-vous ici</a>.</p>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('form-inscription').addEventListener('submit', async (e) => {
      e.preventDefault();
      const el = document.getElementById('erreur-inscription');
      el.innerHTML = '';
      try {
        const r = await apiCall('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            prenom: document.getElementById('prenom').value,
            nom: document.getElementById('nom').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            password: document.getElementById('password').value,
            type_inscription: 'compte_gratuit'
          })
        });
        document.getElementById('form-inscription').outerHTML = `<div class="card" style="text-align:center;"><h2>📩 Vérifiez votre boîte mail</h2><p>Un lien de confirmation vient d'être envoyé à <strong>${r.email}</strong>.</p><p style="font-size:14px;">Cliquez dessus pour activer votre compte (pensez à regarder les indésirables). Sans confirmation, la connexion est impossible.</p><p style="font-size:13px; color:#777;">Email erroné ? <a href="/inscription.html">Recommencez l'inscription</a>.</p></div>`;
      } catch (err) { el.innerHTML = `<p class="error">${err.message}</p>`; }
    });
  </script>
</body>
</html>
