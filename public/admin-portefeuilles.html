<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analyses de portefeuille — TAPA CONSEIL</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar"><div class="brand"><img src="/images/logo.png" alt="TAPA CONSEIL"><span class="brand-text">Analyses de portefeuille</span></div><a href="/admin.html">← Clients</a></div>
  <div class="container" style="max-width: 760px;">
    <div class="card">
      <h1>Analyses en attente de validation</h1>
      <p style="font-size:14px; color:#666;">Générées automatiquement en début de mois pour chaque client ayant des transactions. Relis, ajuste si besoin, puis valide pour l'envoyer.</p>
      <div id="liste-analyses"><p>Chargement...</p></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    async function chargerAnalyses() {
      const { analyses } = await apiCall('/api/admin/analyses-portefeuille');
      const el = document.getElementById('liste-analyses');
      if (!analyses.length) { el.innerHTML = '<p style="color:#999;">Aucune analyse en attente.</p>'; return; }
      el.innerHTML = analyses.map(a => `
        <div class="card" style="margin-bottom:16px;">
          <p><strong>${a.full_name}</strong> — ${new Date(a.mois).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' })}</p>
          <textarea id="contenu-${a.id}" rows="10" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">${a.contenu}</textarea>
          <button onclick="sauvegarder(${a.id})">Enregistrer les modifications</button>
          <button class="btn-gold" onclick="valider(${a.id})">✅ Valider et envoyer</button>
          <div id="resultat-${a.id}"></div>
        </div>
      `).join('');
    }

    async function sauvegarder(id) {
      const contenu = document.getElementById(`contenu-${id}`).value;
      await apiCall(`/api/admin/analyses-portefeuille/${id}`, { method: 'PUT', body: JSON.stringify({ contenu }) });
      document.getElementById(`resultat-${id}`).innerHTML = '<p class="success">Modifications enregistrées.</p>';
    }

    async function valider(id) {
      const contenu = document.getElementById(`contenu-${id}`).value;
      await apiCall(`/api/admin/analyses-portefeuille/${id}`, { method: 'PUT', body: JSON.stringify({ contenu }) });
      await apiCall(`/api/admin/analyses-portefeuille/${id}/valider`, { method: 'POST' });
      await chargerAnalyses();
    }

    (async () => {
      const user = await requireAdminLogin(); if (!user) return;
      if (user.role !== 'admin') { document.querySelector('.container').innerHTML = '<div class="card"><p class="error">Accès réservé à l\'administrateur.</p></div>'; return; }
      await chargerAnalyses();
    })();
  </script>
</body>
</html>
