<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — TAPA CONSEIL</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar"><div class="brand"><img src="/images/logo.png" alt="TAPA CONSEIL"></div></div>
  <div class="container">
    <div class="card">
      <h1>Choisir un nouveau mot de passe</h1>
      <div id="zone-formulaire">
        <form id="form-reset">
          <label>Nouveau mot de passe (6 caractères minimum)</label>
          <input type="password" id="password" required minlength="6">
          <label>Confirmer le nouveau mot de passe</label>
          <input type="password" id="password2" required minlength="6">
          <button type="submit">Valider le nouveau mot de passe</button>
          <div id="resultat"></div>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      document.getElementById('zone-formulaire').innerHTML = '<p class="error">Lien invalide — merci de refaire une demande depuis <a href="/mot-de-passe-oublie.html">cette page</a>.</p>';
    }

    document.getElementById('form-reset')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      const elResultat = document.getElementById('resultat');
      elResultat.innerHTML = '';
      if (password !== password2) { elResultat.innerHTML = '<p class="error">Les deux mots de passe ne correspondent pas.</p>'; return; }
      try {
        await apiCall('/api/auth/reinitialiser-mot-de-passe', { method: 'POST', body: JSON.stringify({ token, password }) });
        document.getElementById('zone-formulaire').innerHTML = '<p class="success">✅ Mot de passe mis à jour ! Tu peux maintenant <a href="/connexion.html">te connecter</a> avec ton nouveau mot de passe.</p>';
      } catch (e) { elResultat.innerHTML = `<p class="error">${e.message}</p>`; }
    });
  </script>
</body>
</html>
